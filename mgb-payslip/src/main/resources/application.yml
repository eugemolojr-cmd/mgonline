server:
  port: 8080

spring:
  application:
    name: backend-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metroguards}
    username: ${DB_USERNAME:metroguards}
    password: ${DB_PASSWORD:change_me_db}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
    issuer: ${KEYCLOAK_ISSUER}

management:
  endpoints:
    web:
      exposure:
        include: health
