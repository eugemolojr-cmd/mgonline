server:
  port: 8081

spring:
  application:
    name: reports-service

app:
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  security:
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
    issuer: ${KEYCLOAK_ISSUER}

management:
  endpoints:
    web:
      exposure:
        include: health
