# Docker DNS returns every replica IP for "backend" / "reports", so nginx
# round-robins across them. Restart the gateway after scaling replicas.
upstream backend_pool {
    least_conn;
    server mgb-payslip:8080;
}

upstream reports_pool {
    least_conn;
    server reports:8081;
}

server {
    listen 80;
    server_name localhost;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Keycloak (needs big buffers for tokens/cookies)
    location /auth/ {
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://keycloak:8080;
    }

    # Reports microservice (must come before /api/)
    location /api/reports/ {
        proxy_pass http://reports_pool;
    }

    # Backend microservice
    location /api/ {
        proxy_pass http://backend_pool;
    }

    # React front-end
    location / {
        proxy_pass http://mg-payslip:80;
    }
}
